<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuzzleMaster — Navin Hill</title>
    <meta name="description" content="PuzzleMaster by Navin Hill" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090e12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="https://media.navinhill.com/brand/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://media.navinhill.com/brand/favicon-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://media.navinhill.com/brand/favicon-16x16.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://media.navinhill.com/brand/favicon-dark-32x32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://media.navinhill.com/brand/favicon-dark-16x16.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://media.navinhill.com/brand/apple-touch-icon.png" />
    <link rel="manifest" href="https://media.navinhill.com/brand/site.webmanifest" />

    <!-- Open Graph & Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Navin Hill" />
    <meta property="og:title" content="PuzzleMaster — Navin Hill" />
    <meta property="og:image" content="https://media.navinhill.com/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://media.navinhill.com/brand/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent-hue: 332;
        --accent-sat: 84%;
        --accent-light: 62%;
        --bg-color: #f8fafc;
        --text-color: #0f172a;
        --panel-bg: #ffffff;
      }

      .dark-mode {
        --bg-color: #0f172a;
        --text-color: #f8fafc;
        --panel-bg: #1e293b;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
        overflow: hidden;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: hsla(var(--accent-hue), var(--accent-sat), var(--accent-light), 0.5);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: hsla(var(--accent-hue), var(--accent-sat), var(--accent-light), 0.8);
      }
    </style>
  </head>
  <body class="dark-mode">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
